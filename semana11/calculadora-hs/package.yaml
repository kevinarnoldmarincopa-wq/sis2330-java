name: calculadora-hs
version: 0.1.0.0
github: "kevinaroldmarincopa-wq/sis2330-java"
license: BSD-3-Clause
author: "Estudiante"
maintainer: "estudiante@example.com"
copyright: "2026"

extra-source-files:
- README.md

dependencies:
- base >= 4.7 && < 5

library:
  source-dirs: src
  exposed-modules:
  - Lib

executables:
  calculadora-hs-exe:
    main: Main.hs
    source-dirs: app
    ghc-options:
    - -Wall
    dependencies:
    - calculadora-hs

tests:
  calculadora-hs-test:
    main: Spec.hs
    source-dirs: test
    dependencies:
    - calculadora-hs
